# Initial research/paper-trading profile for a ₹1,00,000 personal account.
# These are configurable starting defaults, not personalized financial advice.

[account]
capital = 100000
capital_deployment_fraction = 0.80
max_leverage = 1.0
max_positions = 8

[risk]
risk_per_trade_fraction = 0.005
max_open_portfolio_risk_fraction = 0.02
max_single_position_fraction = 0.15
max_sector_exposure_fraction = 0.25
daily_loss_fraction = 0.01
monthly_loss_fraction = 0.05
drawdown_review_fraction = 0.08
hard_drawdown_fraction = 0.12
minimum_reward_risk = 1.5

[scope]
market = "Indian NSE cash equities and liquid ETFs"
trading_style = "positional/swing"
leverage = "none"
account_use = "personal only"
mode = "historical research then paper/shadow trading"
options_and_futures = false
