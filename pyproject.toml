[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-investing"
version = "0.1.0"
description = "Research-first, risk-controlled investing platform for Indian markets"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Agentic Investing" }]
dependencies = ["yfinance>=0.2.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
